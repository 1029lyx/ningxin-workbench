let currentModule = 'dashboard';

function switchModule(name) {
  currentModule = name;
  document.querySelectorAll('.ni').forEach(n => n.classList.toggle('act', n.dataset.m === name));
  const m = MODULES[name];
  document.getElementById('tt').textContent = m.title;
  const ct = document.getElementById('ct');
  ct.innerHTML = '<div class="mod act" id="mod_'+name+'"></div>';
  m.render();
  // 关闭移动端侧边栏
  if (window.innerWidth <= 768) {
    document.getElementById('sb').classList.remove('op');
    document.getElementById('ov').classList.remove('sh');
  }
  ct.scrollTop = 0;
}

// ========== 渲染辅助 ==========
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

function card(title, content) {
  return '<div class="cd"><div class="ct2">'+title+'</div>'+content+'</div>';
}

function field(label, content) {
  return '<div class="field"><div class="fl">'+label+'</div>'+content+'</div>';
}

function input(id, placeholder, val) {
  return '<input class="inp" id="'+id+'" placeholder="'+(placeholder||'')+'" value="'+(val||'')+'">';
}

function textarea(id, placeholder, val) {
  return '<textarea class="ta" id="'+id+'" placeholder="'+(placeholder||'')+'">'+(val||'')+'</textarea>';
}

function saveBtn(id, text) {
  return '<button class="btn bp bb" id="'+id+'">'+(text||'💾 保存')+'</button>';
}

// 复选框保存
function saveChecks(prefix, keys) {
  const data = {};
  keys.forEach(k => { data[k] = document.getElementById(prefix+'_'+k) ? document.getElementById(prefix+'_'+k).classList.contains('ck') : false; });
  Store.set(prefix+'_'+getCurrentDate(), data);
}

function loadChecks(prefix, keys) {
  const data = Store.get(prefix+'_'+getCurrentDate(), {});
  keys.forEach(k => { if (document.getElementById(prefix+'_'+k)) document.getElementById(prefix+'_'+k).classList.toggle('ck', !!data[k]); });
}

function bindCheck(id, key, prefix) {
  const e = document.getElementById(id);
  if (!e) return;
  e.addEventListener('click', () => {
    e.classList.toggle('ck');
    saveChecks(prefix, prefix.split('_')[1] ? Object.keys(window[prefix+'_keys']||{}) : []);
  });
}

// ========== 日期导航条 ==========
function dateNav() {

}

        <div class="si"><div class="sn">¥${(catTotals.shop||0).toFixed(0)}</div><div class="sl">购物</div></div>

    showModal(html2);
  });

function startWordChallenge() {
  const progress = Store.get('english_progress', {mastered: 0, reviewed: 0, wrongList: []});
  // 取今天还没掌握的词，每次5个
  const startIdx = progress.mastered % WORDS.length;
  const batch = [];
  for (let i = 0; i < 5; i++) {
    batch.push(WORDS[(startIdx + i) % WORDS.length]);
  }
  wordSession = {batch, idx: 0, correct: 0, wrong: []};
  showWord();
}

function showWord() {
  if (!wordSession || wordSession.idx >= wordSession.batch.length) {
    finishWordChallenge();
    return;
  }
  const w = wordSession.batch[wordSession.idx];
  const area = document.getElementById('en_word_area');
  if (!area) return;

  // 生成4个选项
  const options = [w[2]]; // 正确释义
  while (options.length < 4) {
    const rand = WORDS[Math.floor(Math.random()*WORDS.length)];
    if (!options.includes(rand[2])) options.push(rand[2]);
  }
  options.sort(() => Math.random()-0.5);

  area.innerHTML = `
    <div class="wc">
      <div class="we">${w[0]}</div>
      <div class="wp">${w[1]}</div>
      <div class="wc2">${w[2]}</div>
      <div class="wex">${w[3]}<br><small>${w[4]}</small></div>
    </div>
    <div class="wq">
      <div class="qq">选择正确的中文释义 (${wordSession.idx+1}/${wordSession.batch.length})</div>
      <div class="qos">
        ${options.map(o => `<div class="qo" data-o="${o}">${o}</div>`).join('')}
      </div>
    </div>
  `;

  area.querySelectorAll('.qo').forEach(qo => {
    qo.addEventListener('click', () => {
      if (qo.classList.contains('cr') || qo.classList.contains('wr')) return;
      if (qo.dataset.o === w[2]) {
        qo.classList.add('cr');
        wordSession.correct++;
        setTimeout(() => { wordSession.idx++; showWord(); }, 800);
      } else {
        qo.classList.add('wr');
        wordSession.wrong.push(w);
        // 标记正确答案
        area.querySelectorAll('.qo').forEach(q => { if (q.dataset.o === w[2]) q.classList.add('cr'); });
        setTimeout(() => { wordSession.idx++; showWord(); }, 1200);
      }
    });
  });
}

function finishWordChallenge() {
  if (!wordSession) return;
  const area = document.getElementById('en_word_area');
  const progress = Store.get('english_progress', {mastered: 0, reviewed: 0, wrongList: []});

  progress.mastered = Math.min(progress.mastered + wordSession.correct, WORDS.length);
  progress.reviewed = wordSession.correct;
  if (wordSession.wrong.length) {
    wordSession.wrong.forEach(w => {
      if (!progress.wrongList.find(x => x[0] === w[0])) progress.wrongList.push(w);
    });
  }
  Store.set('english_progress', progress);

  area.innerHTML = `
    <div class="cd" style="text-align:center;">
      <div style="font-size:40px;margin-bottom:8px;">${wordSession.correct >= 4 ? '🎉' : '💪'}</div>
      <div style="font-size:18px;font-weight:700;color:var(--c-ad);margin-bottom:8px;">本轮完成！</div>
      <div style="font-size:14px;color:var(--c-text);">答对 ${wordSession.correct}/${wordSession.batch.length} 个</div>
      <div style="font-size:13px;color:var(--c-tl);margin-top:4px;">累计掌握 ${progress.mastered} / ${WORDS.length} 词</div>
      <button class="btn bp" style="margin-top:12px;" id="en_next_round">继续闯关</button>
    </div>
  `;
  document.getElementById('en_next_round')?.addEventListener('click', startWordChallenge);
  wordSession = null;
  renderEnglish(); // 刷新进度
}

function renderWrongList() {
  const progress = Store.get('english_progress', {mastered: 0, reviewed: 0, wrongList: []});
  const list = document.getElementById('en_wrong_list');
  if (!list) return;
  if (!progress.wrongList.length) {
    list.innerHTML = '<div class="es"><span class="e2">✨</span>暂无错词，继续加油！</div>';
    return;
  }
  list.innerHTML = progress.wrongList.map(w => `
    <div class="ri">
      <span><b>${w[0]}</b> ${w[1]}</span>
      <span style="font-size:12px;color:var(--c-tl)">${w[2]}</span>
    </div>
  `).join('');
}

// ========== 模块9：每日计划 ==========
function renderDaily() {
  const d = getCurrentDate();
  let tasks = Store.get('daily_'+d, null);
  if (!tasks) {
    // 默认预置任务
    tasks = [
      {id: '1', text: '📖 暑假预习/开学日常', done: false},
      {id: '2', text: '🇬🇧 英语单词背诵', done: false},
      {id: '3', text: '💰 记账打卡', done: false},
      {id: '4', text: '⚖️ 体重记录', done: false},
      {id: '5', text: '📚 读书30分钟', done: false},
      {id: '6', text: '🌙 睡前复盘今日', done: false},
    ];
    Store.set('daily_'+d, tasks);
  }

  const done = tasks.filter(t => t.done).length;
  const total = tasks.length;
  const pct = total ? Math.round(done/total*100) : 0;

  const html = `
    ${dateNav()}
    <div class="cd">
      <div class="ct2"><span class="emoji">🖊️</span> 每日计划 · ${U.fmt(d)}</div>
      <div class="pb"><div class="pf" style="width:${pct}%"></div></div>
      <div style="text-align:center;font-size:13px;color:var(--c-tl);margin-bottom:10px;">已完成 ${done}/${total} · ${pct}%</div>

      <div class="cl2" id="dl_list">
        ${tasks.map(t => `
          <div class="ci ${t.done?'ck':''}" data-id="${t.id}">
            <div class="cbx"></div>
            <span class="ctx">${t.text}</span>
            <span class="ci-del" data-del="${t.id}">✕</span>
          </div>
        `).join('')}
      </div>

      <div class="dv"></div>
      <div class="frow">
        <input class="inp" id="dl_new" placeholder="新增任务..." style="flex:1;">
        <button class="btn bp bsm" id="dl_add">➕ 添加</button>
      </div>
    </div>
    <div class="cd">
      <div class="ct2"><span class="emoji">📋</span> 历史每日计划</div>
      <button class="btn bs bsm" id="dl_history">📖 查看历史计划</button>
    </div>
  `;
  document.getElementById('mod_daily').innerHTML = html;
  bindDateNav(renderDaily);

  // 勾选
  document.querySelectorAll('.ci[data-id]').forEach(c => {
    c.addEventListener('click', (e) => {
      if (e.target.classList.contains('ci-del')) return;
      const id = c.dataset.id;
      const t = tasks.find(x => x.id === id);
      if (t) { t.done = !t.done; Store.set('daily_'+d, tasks); renderDaily(); }
    });
  });

  // 删除
  document.querySelectorAll('.ci-del[data-del]').forEach(d => {
    d.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = d.dataset.del;
      tasks = tasks.filter(t => t.id !== id);
      Store.set('daily_'+getCurrentDate(), tasks);
      renderDaily();
    });
  });

  // 添加
  document.getElementById('dl_add').addEventListener('click', () => {
    const text = document.getElementById('dl_new').value.trim();
    if (!text) return;
    tasks.push({id: Date.now().toString(), text, done: false});
    Store.set('daily_'+getCurrentDate(), tasks);
    renderDaily();
  });

  // 历史
  document.getElementById('dl_history').addEventListener('click', () => {
    let html2 = '<h3>📖 历史每日计划</h3><div class="hl">';
    const keys = Object.keys(localStorage).filter(k => k.startsWith('nx_daily_')).sort().reverse();
    keys.forEach(k => {
      const date = k.replace('nx_daily_','');
      const ts = Store.get('daily_'+date, []);
      const done = ts.filter(t=>t.done).length;
      html2 += `<div class="hi" data-date="${date}"><div class="hd">${U.fmt(date)} (${done}/${ts.length})</div><div>${ts.map(t=>(t.done?'✓':'○')+' '+t.text).join(' · ')}</div></div>`;
    });
    html2 += '</div>';
    showModal(html2);
  });
}

  document.getElementById('moC').innerHTML = html;
  document.getElementById('moO').classList.add('sh');
}
document.getElementById('moO').addEventListener('click', (e) => {
  if (e.target.id === 'moO') document.getElementById('moO').classList.remove('sh');
});

  const sb = document.getElementById('sb');

    sb.classList.toggle('op');

document.querySelectorAll('.ni').forEach(n => {

const savedTheme = Store.get('theme', 'sa');
const themes = {sa:'tsa',m:'tm',s:'ts',l:'tl',p:'tp'};
document.body.className = themes[savedTheme];
document.querySelectorAll('.cb').forEach(c => {

});

// 日期显示
function updateDate() {
  const d = new Date();
  document.getElementById('td2').textContent = `${d.getMonth()+1}/${d.getDate()} ${U.wd()}`;
}
updateDate();
setInterval(updateDate, 60000);

// 离线检测
if (!navigator.onLine) {
  document.getElementById('ob').classList.add('sh');
}
window.addEventListener('online', () => document.getElementById('ob').classList.remove('sh'));
window.addEventListener('offline', () => document.getElementById('ob').classList.add('sh'));

// 初始化
switchModule('dashboard');

// PWA注册（如果浏览器支持）
if ('serviceWorker' in navigator) {
  // 内联Service Worker实现离线
  const swCode = `
    const CACHE='nx-v1';
    self.addEventListener('install',e=>{self.skipWaiting();});
    self.addEventListener('activate',e=>{e.waitUntil(self.clients.claim());});
    self.addEventListener('fetch',e=>{
      e.respondWith(
        caches.match(e.request).then(r=>r||fetch(e.request).then(resp=>{
          if(e.request.url.startsWith(location.origin)){
            const clone=resp.clone();
            caches.open(CACHE).then(c=>c.put(e.request,clone));
          }
          return resp;
        }).catch(()=>caches.match(e.request)))
      );
    });
  `;
  const blob = new Blob([swCode], {type:'application/javascript'});
  const swUrl = URL.createObjectURL(blob);
  // 尝试注册（blob URL的SW可能不被允许，但不影响功能）
  try { navigator.serviceWorker.register(swUrl).catch(()=>{}); } catch(e) {}
}
</script>
